# .streamlit/secrets.toml
# ─────────────────────────────────────────────────────
# OPTIONAL — only needed if you want email alerts sent
# to family members when blood pressure is abnormal.
#
# HOW TO SET UP GMAIL:
# 1. Use a Gmail account (create a dedicated one e.g. strokemonitor.alerts@gmail.com)
# 2. Enable 2-Factor Authentication on that Gmail account
# 3. Go to Google Account → Security → App Passwords
# 4. Generate an App Password for "Mail" → copy the 16-character code
# 5. Paste below (NOT your regular Gmail password — the App Password)
#
# ON STREAMLIT CLOUD:
# Go to App Settings → Secrets → paste these two lines there
# ─────────────────────────────────────────────────────

SENDER_EMAIL    = "your-gmail@gmail.com"
SENDER_PASSWORD = "your-16-char-app-password"
